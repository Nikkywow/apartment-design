<g font-family="Arial,sans-serif" fill="#25352b" font-size="16"><text x="90" y="864">Ракурс: от входа к правой глухой стене; фасад в кадре справа.</text><text x="90" y="891">Кровать: внешний габарит условно 190 × 215 см; тумбы 55 × 40 см.</text><text x="90" y="918">Хранение пунктиром — резерв; открывания и обмеры требуют проверки.</text></g>
