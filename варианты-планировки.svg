<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202826; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64716c; }
      .card-title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202826; }
      .card-subtitle { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8d5c2e; }
      .body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #47544f; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #33413c; }
      .demo { stroke: #d95f4d; stroke-width: 9; stroke-dasharray: 15 11; fill: none; stroke-linecap: round; }
      .new-wall { stroke: #3d7890; stroke-width: 9; fill: none; stroke-linecap: round; }
      .glass { stroke: #3d7890; stroke-width: 8; stroke-dasharray: 4 8; fill: none; stroke-linecap: round; }
      .wardrobe { fill: #7e9d8f; fill-opacity: .68; stroke: #547668; stroke-width: 4; }
      .keep { fill: #d8b06a; fill-opacity: .55; stroke: #c18c31; stroke-width: 4; }
      .callout { fill: #fff8ed; stroke: #d49a3b; stroke-width: 2; }
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24312d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f3f0e8"/>
  <text x="60" y="62" class="title">Варианты планировки по исходному чертежу</text>
  <text x="60" y="94" class="subtitle">Наложения выполнены на один и тот же план 52,0 м²; красным — возможный демонтаж, синим — новые лёгкие конструкции</text>

  <g filter="url(#shadow)">
    <rect x="45" y="125" width="485" height="790" rx="20" fill="#fff"/>
    <rect x="558" y="125" width="485" height="790" rx="20" fill="#fff"/>
    <rect x="1071" y="125" width="485" height="790" rx="20" fill="#fff"/>
  </g>

  <g>
    <text x="75" y="170" class="card-title">A · Сохранить стены</text>
    <text x="75" y="198" class="card-subtitle">Минимум согласований и затрат</text>
    <g transform="translate(55 222) scale(.5)">
      <image href="IMG_5299-plan.png" width="930" height="764"/>
      <rect x="305" y="225" width="112" height="96" rx="8" class="wardrobe"/>
      <rect x="548" y="350" width="200" height="52" rx="8" class="wardrobe"/>
    </g>
    <text x="75" y="640" class="body">• Отдельные прихожая и коридор</text>
    <text x="75" y="672" class="body">• Спальня с обычным шкафом</text>
    <text x="75" y="704" class="body">• Самая простая реализация</text>
    <text x="75" y="748" class="body">Минус: 10,1 м² входной группы</text>
    <text x="75" y="775" class="body">остаются визуально разобщёнными.</text>
  </g>

  <g>
    <text x="588" y="170" class="card-title">B · Частично открыть</text>
    <text x="588" y="198" class="card-subtitle">Рекомендуемый баланс</text>
    <g transform="translate(568 222) scale(.5)">
      <image href="IMG_5299-plan.png" width="930" height="764"/>
      <path d="M431 260 V331 M389 337 H495" class="demo"/>
      <path d="M431 235 V325" class="glass"/>
      <rect x="304" y="224" width="112" height="96" rx="8" class="wardrobe"/>
      <rect x="495" y="325" width="34" height="28" rx="4" class="keep"/>
    </g>
    <text x="588" y="640" class="body">• Снимаются только короткие участки</text>
    <text x="588" y="672" class="body">• Сохраняется простенок у спальни</text>
    <text x="588" y="704" class="body">• Стекло экранирует входную дверь</text>
    <text x="588" y="748" class="body">Плюс: больше света и удобный</text>
    <text x="588" y="775" class="body">единый маршрут без «пустого» холла.</text>
    <rect x="588" y="820" width="412" height="60" rx="12" class="callout"/>
    <text x="608" y="847" class="small">Лучший вариант для этой площади</text>
    <text x="608" y="870" class="small">без чрезмерного вмешательства в стены.</text>
  </g>

  <g>
    <text x="1101" y="170" class="card-title">C · Master + гардероб</text>
    <text x="1101" y="198" class="card-subtitle">Экспериментальный вариант</text>
    <g transform="translate(1081 222) scale(.5)">
      <image href="IMG_5299-plan.png" width="930" height="764"/>
      <path d="M431 260 V331 M389 337 H495" class="demo"/>
      <path d="M431 235 V325" class="glass"/>
      <rect x="304" y="224" width="112" height="96" rx="8" class="wardrobe"/>
      <rect x="495" y="325" width="34" height="28" rx="4" class="keep"/>
      <rect x="616" y="346" width="137" height="38" rx="5" class="wardrobe"/>
      <path d="M540 414 H756" class="new-wall"/>
      <path d="M565 414 H690" class="glass"/>
    </g>
    <text x="1101" y="640" class="body">• Гардеробная полоса 1,25–1,35 м</text>
    <text x="1101" y="672" class="body">• Шкаф 550–600 мм + проход 700–800 мм</text>
    <text x="1101" y="704" class="body">• В спальне лучше кровать 140×200</text>
    <text x="1101" y="748" class="body">Компромисс: спальная зона становится</text>
    <text x="1101" y="775" class="body">плотнее; кровать 160 см нежелательна.</text>
    <rect x="1101" y="820" width="412" height="60" rx="12" class="callout"/>
    <text x="1121" y="847" class="small">Подходит, если закрытое хранение</text>
    <text x="1121" y="870" class="small">важнее ощущения просторной спальни.</text>
  </g>

  <g transform="translate(60 944)">
    <path d="M0 0 H48" class="demo"/><text x="60" y="6" class="small">демонтаж только после обследования</text>
    <path d="M380 0 H428" class="new-wall"/><text x="440" y="6" class="small">новая ненесущая перегородка</text>
    <rect x="770" y="-13" width="42" height="24" class="wardrobe"/><text x="825" y="6" class="small">встроенное хранение</text>
    <rect x="1065" y="-13" width="42" height="24" class="keep"/><text x="1120" y="6" class="small">сохранённый простенок</text>
  </g>
  <text x="60" y="982" class="subtitle">Концепция, не рабочий чертёж: точные размеры и допустимость демонтажа подтверждаются после обмера и проверки конструкций.</text>
</svg>
