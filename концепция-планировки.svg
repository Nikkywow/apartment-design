<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202826; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #62706b; }
      .room { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26312e; text-anchor: middle; }
      .area { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #697670; text-anchor: middle; }
      .label { font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26312e; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #53615c; }
      .note { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #43504b; }
      .wall { stroke: #26312e; stroke-width: 14; fill: none; stroke-linecap: square; }
      .partition { stroke: #26312e; stroke-width: 8; fill: none; }
      .furniture { stroke: #6e8179; stroke-width: 3; fill: #f7f4ed; }
      .joinery { stroke: #66877a; stroke-width: 3; fill: #bfd3c9; }
      .plumbing { stroke: #58768a; stroke-width: 3; fill: #d9e9ef; }
      .demolition { stroke: #d7604d; stroke-width: 7; stroke-dasharray: 14 11; fill: none; }
      .route { stroke: #d09a42; stroke-width: 4; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d09a42"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1e2925" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#f3f0e8"/>
  <text x="70" y="58" class="title">Предварительная концепция планировки</text>
  <text x="70" y="86" class="subtitle">Вариант B — открытый светлый холл, рабочая ниша и максимум хранения</text>

  <g filter="url(#shadow)">
    <rect x="55" y="110" width="900" height="690" rx="18" fill="#ffffff"/>
  </g>

  <g>
    <rect x="90" y="145" width="220" height="250" fill="#e8f0ed"/>
    <rect x="310" y="145" width="210" height="250" fill="#f4ead9"/>
    <rect x="520" y="145" width="210" height="250" fill="#edf0e7"/>
    <rect x="730" y="145" width="190" height="250" fill="#e5eef2"/>
    <rect x="90" y="395" width="640" height="365" fill="#f5eadf"/>
    <rect x="730" y="395" width="190" height="365" fill="#ece7e1"/>

    <path class="wall" d="M90 145 H360 M445 145 H920 V760 H90 V145"/>
    <path class="partition" d="M310 145 V395 M730 145 V760 M90 395 H310 M730 395 H920"/>
    <path class="demolition" d="M520 150 V390 M520 395 H725"/>

    <path d="M360 145 V113 M445 145 V113" stroke="#26312e" stroke-width="5"/>
    <path d="M360 113 Q405 158 445 113" stroke="#8b9893" stroke-width="3" fill="none"/>
    <text x="402" y="131" class="small" text-anchor="middle">вход</text>

    <path d="M90 535 H66 M90 640 H66 M450 760 V786 M610 760 V786 M800 760 V786 M885 760 V786" stroke="#7ea2ae" stroke-width="8"/>

    <rect x="110" y="165" width="70" height="70" rx="10" class="plumbing"/>
    <ellipse cx="145" cy="202" rx="20" ry="27" fill="#fff" stroke="#58768a" stroke-width="3"/>
    <rect x="205" y="165" width="82" height="118" rx="6" class="joinery"/>
    <line x1="205" y1="224" x2="287" y2="224" stroke="#66877a" stroke-width="3"/>
    <circle cx="246" cy="195" r="19" fill="#fff" stroke="#66877a" stroke-width="3"/>
    <circle cx="246" cy="254" r="19" fill="#fff" stroke="#66877a" stroke-width="3"/>
    <rect x="110" y="308" width="82" height="45" rx="6" class="plumbing"/>
    <text x="200" y="372" class="room">WC + постирочная</text>
    <text x="200" y="389" class="area">3,1 м²</text>

    <rect x="328" y="168" width="172" height="56" rx="5" class="joinery"/>
    <line x1="386" y1="168" x2="386" y2="224" stroke="#66877a" stroke-width="2"/>
    <line x1="444" y1="168" x2="444" y2="224" stroke="#66877a" stroke-width="2"/>
    <rect x="335" y="292" width="112" height="42" rx="8" class="furniture"/>
    <circle cx="467" cy="314" r="18" fill="#d09a42" opacity="0.55"/>
    <g stroke="#66877a" stroke-width="5">
      <line x1="495" y1="245" x2="515" y2="255"/><line x1="495" y1="260" x2="515" y2="270"/>
      <line x1="495" y1="275" x2="515" y2="285"/><line x1="495" y1="290" x2="515" y2="300"/>
    </g>
    <text x="415" y="257" class="room">Прихожая</text>
    <text x="415" y="278" class="area">шкаф 600 мм + банкетка</text>

    <rect x="545" y="165" width="160" height="54" rx="5" class="joinery"/>
    <rect x="595" y="231" width="60" height="48" rx="12" class="furniture"/>
    <line x1="625" y1="219" x2="625" y2="231" stroke="#6e8179" stroke-width="3"/>
    <text x="625" y="318" class="room">Рабочая ниша</text>
    <text x="625" y="339" class="area">стол 1400–1600 мм</text>
    <text x="625" y="360" class="area">с естественным светом</text>

    <rect x="830" y="165" width="65" height="145" rx="24" class="plumbing"/>
    <ellipse cx="760" cy="194" rx="21" ry="29" class="plumbing"/>
    <rect x="748" y="304" width="112" height="52" rx="8" class="plumbing"/>
    <text x="825" y="372" class="room">Основная ванная</text>
    <text x="825" y="389" class="area">5,0 м²</text>

    <g class="joinery">
      <rect x="108" y="418" width="62" height="78" rx="4"/>
      <rect x="108" y="496" width="62" height="78" rx="4"/>
      <rect x="108" y="574" width="62" height="78" rx="4"/>
      <rect x="108" y="652" width="62" height="86" rx="4"/>
      <rect x="170" y="442" width="165" height="62" rx="4"/>
    </g>
    <text x="139" y="462" class="small" text-anchor="middle">холод.</text>
    <text x="139" y="540" class="small" text-anchor="middle">мойка</text>
    <text x="139" y="618" class="small" text-anchor="middle">рабочая</text>
    <text x="139" y="697" class="small" text-anchor="middle">варочная</text>
    <text x="252" y="480" class="small" text-anchor="middle">полуостров</text>

    <circle cx="325" cy="650" r="65" class="furniture"/>
    <circle cx="325" cy="650" r="8" fill="#d09a42"/>
    <rect x="260" y="560" width="44" height="32" rx="10" class="furniture"/>
    <rect x="346" y="560" width="44" height="32" rx="10" class="furniture"/>
    <rect x="260" y="708" width="44" height="32" rx="10" class="furniture"/>
    <rect x="346" y="708" width="44" height="32" rx="10" class="furniture"/>

    <rect x="470" y="535" width="175" height="82" rx="18" class="furniture"/>
    <line x1="528" y1="535" x2="528" y2="617" stroke="#6e8179" stroke-width="2"/>
    <line x1="586" y1="535" x2="586" y2="617" stroke="#6e8179" stroke-width="2"/>
    <rect x="688" y="520" width="24" height="120" rx="4" fill="#5e6a66"/>
    <rect x="510" y="653" width="95" height="42" rx="18" class="furniture"/>
    <text x="455" y="716" class="room">Кухня‑гостиная</text>
    <text x="455" y="738" class="area">20,5 м² + визуально присоединённый холл</text>

    <rect x="747" y="414" width="155" height="58" rx="5" class="joinery"/>
    <line x1="798" y1="414" x2="798" y2="472" stroke="#66877a" stroke-width="2"/>
    <line x1="850" y1="414" x2="850" y2="472" stroke="#66877a" stroke-width="2"/>
    <rect x="780" y="532" width="105" height="180" rx="8" class="furniture"/>
    <rect x="790" y="542" width="85" height="56" rx="12" fill="#fff" stroke="#6e8179" stroke-width="2"/>
    <rect x="746" y="558" width="30" height="48" rx="6" class="furniture"/>
    <rect x="889" y="558" width="30" height="48" rx="6" class="furniture"/>
    <text x="825" y="714" class="room">Спальня</text>
    <text x="825" y="736" class="area">13,3 м² · кровать 1600 мм</text>

    <path class="route" d="M405 150 C405 245 455 315 585 365 C670 398 670 490 600 520"/>
    <path class="route" d="M620 370 C710 395 745 420 780 500"/>

    <circle cx="515" cy="185" r="18" fill="#d7604d"/>
    <text x="515" y="191" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <circle cx="630" cy="394" r="18" fill="#d7604d"/>
    <text x="630" y="400" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  </g>

  <g>
    <text x="1005" y="145" class="title" font-size="28">Логика решения</text>
    <text x="1005" y="186" class="label">1. Открыть холл</text>
    <text x="1005" y="212" class="note">Убрать отмеченные перегородки</text>
    <text x="1005" y="235" class="note">только после проверки, что они</text>
    <text x="1005" y="258" class="note">ненесущие. Свет проходит глубже.</text>

    <text x="1005" y="304" class="label">2. Убрать «пустой» коридор</text>
    <text x="1005" y="330" class="note">Зона 5,1 м² получает рабочий стол,</text>
    <text x="1005" y="353" class="note">хранение и становится частью</text>
    <text x="1005" y="376" class="note">общего пространства.</text>

    <text x="1005" y="422" class="label">3. Сохранить приватность</text>
    <text x="1005" y="448" class="note">Реечная или стеклянная перегородка</text>
    <text x="1005" y="471" class="note">экранирует вход, спальня остаётся</text>
    <text x="1005" y="494" class="note">полностью изолированной.</text>

    <text x="1005" y="540" class="label">4. Собрать хранение</text>
    <text x="1005" y="566" class="note">Встроенный шкаф в прихожей, шкаф</text>
    <text x="1005" y="589" class="note">в спальне, постирочная и высокий</text>
    <text x="1005" y="612" class="note">пенал на кухне.</text>

    <rect x="1005" y="652" width="26" height="18" fill="#bfd3c9" stroke="#66877a" stroke-width="2"/>
    <text x="1044" y="667" class="small">встроенная мебель</text>
    <line x1="1005" y1="699" x2="1033" y2="699" class="demolition"/>
    <text x="1044" y="704" class="small">демонтаж после проверки</text>
    <line x1="1005" y1="737" x2="1033" y2="737" class="route"/>
    <text x="1044" y="742" class="small">основные маршруты</text>

    <rect x="990" y="780" width="350" height="70" rx="12" fill="#fff4e8" stroke="#d09a42" stroke-width="2"/>
    <text x="1008" y="808" class="small" font-weight="700">Концепция, не рабочий чертёж.</text>
    <text x="1008" y="831" class="small">Точные размеры — после обмеров и проверки стен.</text>
  </g>
</svg>
